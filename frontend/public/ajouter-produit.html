<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajouter un produit</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/pages/ajouter-produit.js" defer></script>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <div id="header"></div>

    <main class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow">
      <h1 class="text-2xl font-bold mb-6">Ajouter un produit</h1>

      <form id="addProductForm" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Libellé</label>
          <input
            type="text"
            name="libelle"
            required
            class="w-full border p-2 rounded"
          />
        </div>

        <div>
          <label class="block mb-1 font-medium">Description</label>
          <textarea
            name="description"
            required
            class="w-full border p-2 rounded"
          ></textarea>
        </div>

        <div>
          <label class="block mb-1 font-medium">Prix (€)</label>
          <input
            type="number"
            name="prix"
            step="0.01"
            min="0"
            required
            class="w-full border p-2 rounded"
          />
        </div>

        <div>
          <label class="block mb-1 font-medium">Catégorie</label>
          <select name="categorie" required class="w-full border p-2 rounded">
            <option value="">-- Sélectionner --</option>
            <option value="Électronique">Électronique</option>
            <option value="Vêtements">Vêtements</option>
            <option value="Maison">Maison</option>
            <option value="Autre">Autre</option>
          </select>
        </div>

        <div>
          <label class="block mb-1 font-medium">Images (max 3)</label>
          <input
            type="file"
            name="images"
            accept="image/*"
            multiple
            class="w-full"
          />
        </div>

        <div id="previewContainer" class="flex gap-2 mt-2 flex-wrap"></div>

        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
        >
          Ajouter le produit
        </button>
      </form>
    </main>

    <div id="footer"></div>
  </body>
</html>
