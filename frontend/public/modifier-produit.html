<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modifier un produit</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/pages/modifier-produit.js"></script>
  </head>
  <body>
    <div id="header"></div>

    <main class="p-4 max-w-2xl mx-auto">
      <h1 class="text-2xl font-bold mb-6">Modifier un produit</h1>
      <form id="editProductForm" class="space-y-4">
        <input
          type="text"
          name="libelle"
          placeholder="Libellé"
          class="border p-2 w-full"
          required
        />
        <textarea
          name="description"
          placeholder="Description"
          class="border p-2 w-full"
          rows="4"
          required
        ></textarea>
        <input
          type="number"
          step="0.01"
          min="0"
          name="prix"
          placeholder="Prix"
          class="border p-2 w-full"
          required
        />
        <select name="categorie" class="border p-2 w-full" required></select>

        <!-- Images existantes -->
        <div
          id="existingImagesContainer"
          class="flex gap-2 flex-wrap mt-2"
        ></div>

        <!-- Upload nouvelles images -->
        <label class="block mt-4 font-semibold"
          >Ajouter de nouvelles images</label
        >
        <input
          type="file"
          name="images"
          accept="image/*"
          multiple
          class="border p-2 w-full"
        />
        <div id="newImagePreview" class="flex gap-2 flex-wrap mt-2"></div>

        <button class="bg-blue-600 text-white px-4 py-2 rounded" type="submit">
          Enregistrer les modifications
        </button>
      </form>
    </main>

    <div id="footer"></div>
  </body>
</html>
